<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前端流式测试</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      max-width: 800px; 
      margin: 0 auto;
      background: #1a1a2e;
      color: white;
    }
    textarea { 
      width: 100%; 
      height: 100px; 
      margin-bottom: 10px; 
      padding: 10px;
      background: #2d2d44;
      color: white;
      border: 1px solid #444;
      border-radius: 4px;
    }
    button { 
      padding: 10px 20px; 
      background: #4f46e5; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer;
    }
    #output { 
      margin-top: 20px; 
      padding: 15px; 
      border: 1px solid #444; 
      min-height: 300px;
      background: #2d2d44;
      border-radius: 4px;
    }
    #status { 
      margin-bottom: 10px; 
      padding: 10px; 
      background: #2d2d44;
      border-radius: 4px;
    }
    .loading { color: #f59e0b; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>前端流式API测试</h1>
  <div id="status" class="loading">准备就绪</div>
  <textarea id="input" placeholder="请输入要生成的内容...">请续写以下故事：我意外穿越到古代，成为了一名寒门书生。</textarea>
  <button onclick="testStream()">测试流式输出</button>
  <div id="output"></div>

  <script>
    // 直接使用有效的API Key进行测试
    const API_KEY = 'sk-b2af4751f829411396bed98117d3958b';
    
    console.log('=== 前端流式测试 ===');
    console.log('API Key loaded:', API_KEY ? 'Yes' : 'No');
    console.log('API Key length:', API_KEY?.length || 0);

    async function testStream() {
      const input = document.getElementById('input').value;
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      
      output.innerHTML = '';
      status.textContent = '正在连接API...';
      status.className = 'loading';
      
      console.log('=== 开始流式请求 ===');
      console.log('Input length:', input.length);
      
      try {
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`,
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: '你是一个专业的写作助手。' },
              { role: 'user', content: input }
            ],
            stream: true,
            temperature: 0.7,
            max_tokens: 500,
          }),
        });

        console.log('Response status:', response.status);
        console.log('Response headers:', response.headers);
        
        status.textContent = 'API连接成功，正在接收数据...';
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let count = 0;

        while (true) {
          console.log('Waiting for next chunk...');
          const { done, value } = await reader.read();
          
          console.log('Read result:', { done, valueLength: value?.length || 0 });
          
          if (value) {
            buffer += decoder.decode(value, { stream: true });
            console.log('Buffer length:', buffer.length);
          }

          while (buffer.includes('\n')) {
            const lineEnd = buffer.indexOf('\n');
            const line = buffer.slice(0, lineEnd);
            buffer = buffer.slice(lineEnd + 1);

            console.log('Processing line:', line.length, 'chars');
            
            if (line.trim() === 'data: [DONE]') {
              console.log('Received [DONE] marker');
              status.textContent = '完成！共接收 ' + count + ' 个数据块';
              status.className = 'success';
              return;
            }
            if (!line.startsWith('data: ')) continue;

            try {
              const jsonStr = line.slice(6);
              const data = JSON.parse(jsonStr);
              const content = data.choices[0]?.delta?.content;
              
              if (content) {
                count++;
                output.textContent += content;
                console.log('Chunk #' + count + ': ' + content.length + ' chars, total: ' + output.textContent.length);
              }
            } catch (e) {
              console.warn('解析错误:', e);
            }
          }

          if (done && !buffer.trim()) {
            status.textContent = '完成！共接收 ' + count + ' 个数据块';
            status.className = 'success';
            return;
          }
        }
      } catch (error) {
        status.textContent = '错误: ' + error.message;
        status.className = 'error';
        console.error('Error:', error);
      }
    }
  </script>
</body>
</html>
