<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流式API测试</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; }
    button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 200px; }
    #status { margin-bottom: 10px; padding: 10px; background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>流式API测试</h1>
  <div id="status">准备就绪</div>
  <textarea id="input" placeholder="请输入要生成的内容...">请续写以下故事：我意外穿越到古代，成为了一名寒门书生。</textarea>
  <button onclick="testStream()">测试流式输出</button>
  <div id="output"></div>

  <script>
    async function testStream() {
      const apiKey = '';
      const input = document.getElementById('input').value;
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      
      output.innerHTML = '';
      status.textContent = '正在连接API...';

      try {
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: '你是一个专业的写作助手。' },
              { role: 'user', content: input }
            ],
            stream: true,
            temperature: 0.7,
            max_tokens: 500,
          }),
        });

        status.textContent = 'API连接成功，正在接收数据...';
        console.log('Response status:', response.status);
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let count = 0;

        while (true) {
          const { done, value } = await reader.read();
          
          if (value) {
            buffer += decoder.decode(value, { stream: true });
          }

          while (buffer.includes('\n')) {
            const lineEnd = buffer.indexOf('\n');
            const line = buffer.slice(0, lineEnd);
            buffer = buffer.slice(lineEnd + 1);

            if (line.trim() === 'data: [DONE]') {
              status.textContent = '完成！共接收 ' + count + ' 个数据块';
              return;
            }
            if (!line.startsWith('data: ')) continue;

            try {
              const jsonStr = line.slice(6);
              const data = JSON.parse(jsonStr);
              const content = data.choices[0]?.delta?.content;
              
              if (content) {
                count++;
                output.textContent += content;
                console.log('Chunk #' + count + ': ' + content.length + ' chars');
              }
            } catch (e) {
              console.warn('解析错误:', e);
            }
          }

          if (done && !buffer.trim()) {
            status.textContent = '完成！共接收 ' + count + ' 个数据块';
            return;
          }
        }
      } catch (error) {
        status.textContent = '错误: ' + error.message;
        console.error('Error:', error);
      }
    }
  </script>
</body>
</html>
