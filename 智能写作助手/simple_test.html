<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API测试</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: white; }
    textarea { width: 100%; height: 80px; margin-bottom: 10px; padding: 10px; background: #2d2d44; color: white; border: 1px solid #444; }
    button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #output { margin-top: 20px; padding: 15px; border: 1px solid #444; min-height: 200px; background: #2d2d44; }
    #status { margin-bottom: 10px; padding: 10px; background: #2d2d44; }
    .loading { color: #f59e0b; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>API测试</h1>
  <div id="status" class="loading">准备就绪</div>
  <textarea id="input" placeholder="请输入文本...">你好</textarea>
  <button onclick="testApi()">测试API</button>
  <div id="output"></div>

  <script>
    const API_KEY = 'sk-b2af4751f829411396bed98117d3958b';
    
    async function testApi() {
      const input = document.getElementById('input').value;
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      
      output.innerHTML = '';
      status.textContent = '正在发送请求...';
      status.className = 'loading';
      
      console.log('=== 开始API请求 ===');
      console.log('输入内容:', input);
      
      try {
        const startTime = Date.now();
        console.log('发送请求时间:', new Date().toLocaleTimeString());
        
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`,
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{ role: 'user', content: input }],
            stream: false,
            temperature: 0.7,
            max_tokens: 500,
          }),
          timeout: 30000,
        });
        
        const responseTime = Date.now() - startTime;
        console.log('响应时间:', responseTime, 'ms');
        console.log('响应状态:', response.status);
        
        if (!response.ok) {
          const errorText = await response.text();
          console.error('HTTP错误:', errorText);
          status.textContent = `HTTP错误: ${response.status}`;
          status.className = 'error';
          output.innerHTML = errorText;
          return;
        }
        
        const data = await response.json();
        const content = data.choices[0]?.message?.content || '';
        
        console.log('响应内容长度:', content.length);
        console.log('响应内容:', content);
        
        status.textContent = `成功！响应时间: ${responseTime}ms`;
        status.className = 'success';
        output.textContent = content;
        
      } catch (error) {
        console.error('请求失败:', error);
        status.textContent = '请求失败: ' + error.message;
        status.className = 'error';
        output.textContent = '详细错误: ' + JSON.stringify(error);
      }
    }
  </script>
</body>
</html>
